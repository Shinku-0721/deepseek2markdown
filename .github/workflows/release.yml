name: Release Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test, package and release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag and manifest version
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Tag version ${TAG_VERSION} does not match manifest version ${VERSION}"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: node --test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check content.js
          node --check popup/popup.js
          for file in lib/*.js; do
            node --check "$file"
          done

      - name: Package extension
        shell: bash
        run: |
          mkdir -p dist
          ASSET="dist/deepseek2markdown-v${VERSION}.zip"

          zip -r "$ASSET" \
            manifest.json \
            content.js \
            LICENSE \
            icons \
            lib \
            popup

          (
            cd dist
            sha256sum "$(basename "$ASSET")" > "$(basename "${ASSET}.sha256")"
          )
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$ASSET" "${ASSET}.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$ASSET" "${ASSET}.sha256" \
              --verify-tag \
              --generate-notes \
              --title "DeepSeek to Markdown v${VERSION}"
          fi
